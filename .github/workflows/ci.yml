name: CI/CD Pipeline

on:
  push:
    branches: [main, DEV]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Tests (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest httpx

      - name: Ejecutar tests unitarios e integración
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pytest tests/ -v

  deploy:
    name: Continuous Deployment (CD)
    needs: test
    # El despliegue solo se ejecuta si los tests pasan Y estamos en la rama principal (main o DEV)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DEV')
    runs-on: ubuntu-latest

    steps:
      - name: Disparar el Despliegue en Render (Deploy Hook)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK no está configurado en GitHub Secrets."
            exit 1
          fi
          echo "Todos los tests han pasado exitosamente. Ordenando despliegue a Render..."
          curl -X POST "$RENDER_DEPLOY_HOOK"
